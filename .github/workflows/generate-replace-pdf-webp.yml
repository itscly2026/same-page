name: Generate replace PDF WebP

on:
  push:
    branches:
      - feat/home-shared-layers-gif
    paths:
      - .github/workflows/generate-replace-pdf-webp.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-shared-layers-gif
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Generate 2D animated WebP
        run: python scripts/artwork/replace-pdf.py
      - name: Use WebP on homepage and remove old GIF
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/client/routes/home-page.tsx")
          text = path.read_text()
          text = text.replace(
              'import replacePdfAnimation from "../assets/home/replace-pdf.gif";',
              'import replacePdfAnimation from "../assets/home/replace-pdf-animation.webp";',
              1,
          )
          text = text.replace(
              '"抬起原有批注层，将 PDF 1 替换为局部修订的 PDF 2，再把同一批注层落回原页码和位置。"',
              '"Notes 批注从 final.pdf 平移到 final_v2.pdf；修订版中一个橙色自然音改为带升号的蓝色音符，批注位置保持不变。"',
              1,
          )
          path.write_text(text)
      - name: Commit generated artwork
        run: |
          rm -f src/client/assets/home/replace-pdf.gif
          rm .github/workflows/generate-replace-pdf-webp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/artwork/replace-pdf.py src/client/assets/home src/client/routes/home-page.tsx .github/workflows/generate-replace-pdf-webp.yml
          git commit -m "feat: use 2D WebP for replace PDF animation"
          git push origin HEAD:feat/home-shared-layers-gif
