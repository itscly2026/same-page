name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded PRs can stop immediately. Every main run has a distinct group so
# its migration/deployment is never interrupted by a later push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: CI scope regression tests
        run: node --test scripts/ci-scope.test.mjs

      - name: Determine verification scope
        id: scope
        run: node scripts/ci-scope.mjs

      - name: Use Node.js 24
        if: steps.scope.outputs.full == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.full == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint
        if: steps.scope.outputs.full == 'true'
        run: npm run lint

      - name: Type check
        if: steps.scope.outputs.full == 'true'
        run: npm run typecheck

      - name: Client tests
        if: steps.scope.outputs.full == 'true'
        run: npm run test

      - name: Worker tests
        if: steps.scope.outputs.full == 'true'
        run: npm run test:worker

      - name: Install Playwright Chromium and WebKit
        if: steps.scope.outputs.full == 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: PWA update handover
        if: steps.scope.outputs.full == 'true'
        run: npm run test:pwa-update

      # PWA handover builds two synthetic versions; overwrite them with the
      # current commit before measuring production assets.
      - name: Production build
        if: steps.scope.outputs.full == 'true'
        run: npm run build

      - name: Loading performance feedback loop
        if: steps.scope.outputs.full == 'true'
        run: node scripts/measure-loading-performance.mjs

      - name: Visual report tests
        if: steps.scope.outputs.full == 'true'
        run: npm run test:visual-report

      - name: Migration tests
        if: steps.scope.outputs.full == 'true'
        run: npm run test:migrations

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.outputs.full == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: same-page-production
      cancel-in-progress: false
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build production assets
        run: npm run build

      - name: Record production recovery point and aggregate state
        run: |
          npx wrangler d1 time-travel info same-page-production --json
          npx wrangler d1 execute same-page-production --remote --command "SELECT 'users' AS metric, COUNT(*) AS value FROM user UNION ALL SELECT 'memberships', COUNT(*) FROM memberships UNION ALL SELECT 'annotations', COUNT(*) FROM annotation_objects UNION ALL SELECT 'sync_operations', COUNT(*) FROM annotation_sync_operations UNION ALL SELECT 'sync_high_water', COALESCE(MAX(seq), 0) FROM sqlite_sequence WHERE name = 'annotation_sync_operations' UNION ALL SELECT 'scores', COUNT(*) FROM scores UNION ALL SELECT 'current_pdf_pointers', COUNT(current_version_id) FROM scores UNION ALL SELECT 'pdf_versions', COUNT(*) FROM score_versions UNION ALL SELECT 'logical_storage_bytes', COALESCE(SUM(storage_used_bytes), 0) FROM choirs UNION ALL SELECT 'object_deletion_queue', COUNT(*) FROM score_object_deletions"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply production database migrations
        run: npx wrangler d1 migrations apply same-page-production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Backfill production score filenames
        run: node scripts/backfill-score-file-names.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production score schema
        run: >-
          npx wrangler d1 execute same-page-production --remote
          --command "SELECT scores.file_name, scores.file_name_key,
          scores.trashed_at, scores.trash_expires_at,
          scores.version_revision, scores.last_version_number,
          annotation_layers.default_slot
          FROM scores LEFT JOIN annotation_layers ON annotation_layers.score_id = scores.id
          LIMIT 0"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production lifecycle schema
        run: >-
          npx wrangler d1 execute same-page-production --remote
          --command "SELECT candidate_expires_at, base_revision FROM score_versions LIMIT 0;
          SELECT lifecycle_revision, last_lifecycle_action, removed_for_deletion_id FROM memberships LIMIT 0;
          SELECT user_id, deletion_id, expires_at FROM user_lifecycle LIMIT 0;
          SELECT user_id, allowed_methods FROM lifecycle_reauthentication LIMIT 0;
          SELECT session_id, method FROM session_auth_methods LIMIT 0;
          PRAGMA foreign_key_list(annotation_sync_operations);
          SELECT seq FROM sqlite_sequence WHERE name = 'annotation_sync_operations';
          PRAGMA foreign_key_check"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify production deployment
        run: npm run verify:deployment -- https://samepage.clyapps.com
