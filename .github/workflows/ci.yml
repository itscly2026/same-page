name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded PRs can stop immediately. Every main run has a distinct group so
# its migration/deployment is never interrupted by a later push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      full: ${{ steps.scope.outputs.full }}
      client: ${{ steps.scope.outputs.client }}
      worker: ${{ steps.scope.outputs.worker }}
      visual: ${{ steps.scope.outputs.visual }}
      pwa: ${{ steps.scope.outputs.pwa }}
      performance: ${{ steps.scope.outputs.performance }}
      migration: ${{ steps.scope.outputs.migration }}
      build: ${{ steps.scope.outputs.build }}
      deploy: ${{ steps.scope.outputs.deploy }}
      smoke: ${{ steps.scope.outputs.smoke }}
      renderer: ${{ steps.scope.outputs.renderer }}
      browserGroup: ${{ steps.scope.outputs.browserGroup }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: CI scope regression tests
        run: node --test scripts/ci-scope.test.mjs
      - name: Determine verification scope
        id: scope
        run: node scripts/ci-scope.mjs

  checks:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Lint
        if: needs.scope.outputs.full == 'true'
        run: npm run lint
      - name: Type check
        if: needs.scope.outputs.full == 'true'
        run: npm run typecheck
      - name: Client tests
        if: needs.scope.outputs.client == 'true'
        run: npm run test
      - name: Worker tests
        if: needs.scope.outputs.worker == 'true'
        run: npm run test:worker
      - name: Migration tests
        if: needs.scope.outputs.migration == 'true'
        run: npm run test:migrations

  visual:
    needs: scope
    if: needs.scope.outputs.visual == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Browser layout and interaction regressions
        run: node scripts/run-browser-tests.mjs visual "${{ needs.scope.outputs.browserGroup }}"
      - name: Preserve synthetic test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/verification/
          if-no-files-found: ignore
          retention-days: 14

  integration:
    needs: scope
    if: >-
      needs.scope.outputs.build == 'true' ||
      needs.scope.outputs.pwa == 'true' ||
      needs.scope.outputs.performance == 'true' ||
      needs.scope.outputs.smoke == 'true' ||
      needs.scope.outputs.renderer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Use Python for native PDF runtime
        if: needs.scope.outputs.smoke == 'true' || needs.scope.outputs.renderer == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: renderer/requirements.txt
      - name: Install native PDF runtime
        if: needs.scope.outputs.smoke == 'true' || needs.scope.outputs.renderer == 'true'
        run: python -m pip install -r renderer/requirements.txt
      - name: Verify native renderer
        if: needs.scope.outputs.renderer == 'true'
        run: |
          python renderer/verify.py
          python renderer/test_transport.py
      - name: Verify and package the Linux renderer
        if: needs.scope.outputs.renderer == 'true' || needs.scope.outputs.deploy == 'true'
        run: |
          docker build --tag same-page-renderer:verify renderer
          docker run --rm --network none --memory 1g --cpus 1 \
            --mount type=bind,src="$PWD/renderer/fixtures",dst=/app/fixtures,readonly \
            --mount type=bind,src="$PWD/renderer/verify.py",dst=/app/verify.py,readonly \
            --tmpfs /artifacts:uid=10001,gid=10001,size=64m \
            same-page-renderer:verify python /app/verify.py > renderer/verified-output.json
          docker run --rm --network none --memory 1g --cpus 1 \
            --mount type=bind,src="$PWD/renderer/fixtures",dst=/app/fixtures,readonly \
            --mount type=bind,src="$PWD/renderer/test_transport.py",dst=/app/test_transport.py,readonly \
            same-page-renderer:verify python /app/test_transport.py
          docker save --output renderer/image.tar same-page-renderer:verify
      - name: Install Playwright Chromium and WebKit
        if: >-
          needs.scope.outputs.pwa == 'true' ||
          needs.scope.outputs.performance == 'true' ||
          needs.scope.outputs.smoke == 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: PWA update handover
        if: needs.scope.outputs.pwa == 'true'
        run: npm run test:pwa-update

      # PWA handover builds two synthetic versions; overwrite them with the
      # current commit before measuring production assets.
      - name: Production build
        if: needs.scope.outputs.build == 'true'
        run: npm run build
      - name: Loading performance feedback loop
        if: needs.scope.outputs.performance == 'true'
        run: node scripts/measure-loading-performance.mjs
      - name: Real browser Worker storage smoke
        timeout-minutes: 5
        if: needs.scope.outputs.smoke == 'true'
        run: node scripts/run-browser-tests.mjs smoke "${{ needs.scope.outputs.browserGroup }}"
      - name: Seal verified release
        if: github.event_name == 'push' && needs.scope.outputs.deploy == 'true'
        run: |
          node scripts/release-artifact.mjs seal "$GITHUB_SHA"
          tar -cf release.tar dist migrations renderer wrangler.jsonc package-lock.json release.json
      - name: Upload verified release
        if: github.event_name == 'push' && needs.scope.outputs.deploy == 'true'
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          overwrite: true
          path: release.tar
          retention-days: 14
          if-no-files-found: error
      - name: Record verification identity
        if: github.event_name == 'push' && needs.scope.outputs.deploy == 'true'
        run: |
          echo "Source: $GITHUB_SHA; artifact: $ARTIFACT_URL; digest: $ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
      - name: Preserve synthetic test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/verification/
          if-no-files-found: ignore
          retention-days: 14

  # Keep the existing required check name. Skipped work is allowed only when
  # the successful scope job explicitly did not select it.
  verify:
    if: always()
    needs: [scope, checks, visual, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      deploy: ${{ needs.scope.outputs.deploy }}
    steps:
      - name: Require every selected verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const jobs = JSON.parse(process.env.RESULTS);
          assert.equal(jobs.scope.result, 'success', 'scope must succeed');
          const scope = jobs.scope.outputs;
          const expected = {
            checks: scope.full === 'true',
            visual: scope.visual === 'true',
            integration: ['build', 'pwa', 'performance', 'smoke', 'renderer'].some(key => scope[key] === 'true'),
          };
          for (const [name, selected] of Object.entries(expected)) {
            assert.equal(jobs[name].result, selected ? 'success' : 'skipped', name);
          }
          JS

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.outputs.deploy == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: same-page-production
      cancel-in-progress: false
    environment: production
    permissions:
      contents: read
      deployments: write
      id-token: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Admit release under production lock
        id: admission
        run: node scripts/release-admission.mjs admit

      - name: Download verified release
        if: steps.admission.outputs.proceed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}

      - name: Verify artifact before production writes
        if: steps.admission.outputs.proceed == 'true'
        run: |
          tar -xf release.tar
          node scripts/release-artifact.mjs verify "$GITHUB_SHA"

      - name: Use Node.js 24
        if: steps.admission.outputs.proceed == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.admission.outputs.proceed == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Authenticate Google Cloud deployment
        if: steps.admission.outputs.proceed == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: same-page-clyapps
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Use Google Cloud SDK
        if: steps.admission.outputs.proceed == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Deploy and verify the sealed renderer image
        if: steps.admission.outputs.proceed == 'true'
        run: bash renderer/deploy.sh
        env:
          PDF_RENDERER_SECRET: ${{ secrets.PDF_RENDERER_SECRET }}

      - name: Record production recovery point and aggregate state
        if: steps.admission.outputs.proceed == 'true'
        run: |
          npx wrangler d1 time-travel info same-page-production --json
          node scripts/verify-lifecycle-migration.mjs before "$RUNNER_TEMP/same-page-before-migration.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply production database migrations
        if: steps.admission.outputs.proceed == 'true'
        run: |
          node scripts/prepare-drive-owners.mjs --remote
          npx wrangler d1 migrations apply same-page-production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Backfill production score filenames
        if: steps.admission.outputs.proceed == 'true'
        run: node scripts/backfill-score-file-names.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production score schema
        if: steps.admission.outputs.proceed == 'true'
        run: >-
          npx wrangler d1 execute same-page-production --remote
          --command "SELECT scores.file_name, scores.file_name_key,
          scores.trashed_at, scores.trash_expires_at,
          scores.version_revision, scores.last_version_number,
          annotation_layers.default_slot
          FROM scores LEFT JOIN annotation_layers ON annotation_layers.score_id = scores.id
          LIMIT 0"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production lifecycle schema
        if: steps.admission.outputs.proceed == 'true'
        run: node scripts/verify-lifecycle-migration.mjs after "$RUNNER_TEMP/same-page-before-migration.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and assets
        if: steps.admission.outputs.proceed == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/same_page/wrangler.json

      - name: Verify production deployment
        if: steps.admission.outputs.proceed == 'true'
        run: npm run verify:deployment -- https://samepage.clyapps.com "$GITHUB_SHA"

      - name: Record release result
        if: always() && steps.admission.outputs.deployment_id != ''
        run: node scripts/release-admission.mjs "$RELEASE_STATE"
        env:
          DEPLOYMENT_ID: ${{ steps.admission.outputs.deployment_id }}
          RELEASE_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
