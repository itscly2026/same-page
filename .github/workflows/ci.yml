name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded PRs can stop immediately. Every main run has a distinct group so
# its migration/deployment is never interrupted by a later push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: CI scope regression tests
        run: node --test scripts/ci-scope.test.mjs

      - name: Determine verification scope
        id: scope
        run: node scripts/ci-scope.mjs

      - name: Use Node.js 24
        if: steps.scope.outputs.full == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.full == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Use Python for native PDF regression
        if: steps.scope.outputs.full == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install and verify native renderer
        if: steps.scope.outputs.full == 'true'
        run: |
          python -m pip install -r renderer/requirements.txt
          python renderer/verify.py

      - name: Verify packaged Linux renderer without network access
        if: steps.scope.outputs.full == 'true'
        run: |
          docker build --tag same-page-renderer:verify renderer
          docker run --rm --network none --memory 1g --cpus 1 \
            --mount type=bind,src="$PWD/renderer/fixtures",dst=/app/fixtures,readonly \
            --mount type=bind,src="$PWD/renderer/verify.py",dst=/app/verify.py,readonly \
            --tmpfs /artifacts:uid=10001,gid=10001,size=64m \
            same-page-renderer:verify python /app/verify.py

      - name: Lint
        if: steps.scope.outputs.full == 'true'
        run: npm run lint

      - name: Type check
        if: steps.scope.outputs.full == 'true'
        run: npm run typecheck

      - name: Client tests
        if: steps.scope.outputs.client == 'true'
        run: npm run test

      - name: Worker tests
        if: steps.scope.outputs.worker == 'true'
        run: npm run test:worker

      - name: Install Playwright Chromium and WebKit
        if: >-
          steps.scope.outputs.visual == 'true' ||
          steps.scope.outputs.pwa == 'true' ||
          steps.scope.outputs.performance == 'true' ||
          steps.scope.outputs.smoke == 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: PWA update handover
        if: steps.scope.outputs.pwa == 'true'
        run: npm run test:pwa-update

      # PWA handover builds two synthetic versions; overwrite them with the
      # current commit before measuring production assets.
      - name: Production build
        if: steps.scope.outputs.build == 'true'
        run: npm run build

      - name: Loading performance feedback loop
        if: steps.scope.outputs.performance == 'true'
        run: node scripts/measure-loading-performance.mjs

      - name: Visual report tests
        if: steps.scope.outputs.visual == 'true'
        run: npm run test:visual-report

      - name: Migration tests
        if: steps.scope.outputs.migration == 'true'
        run: npm run test:migrations

      - name: Real browser Worker storage smoke
        if: steps.scope.outputs.smoke == 'true'
        run: npm run test:smoke

      - name: Seal verified release
        if: steps.scope.outputs.build == 'true'
        run: |
          node scripts/release-artifact.mjs seal "$GITHUB_SHA"
          tar -cf release.tar dist migrations renderer wrangler.jsonc package-lock.json release.json

      - name: Upload verified release
        if: steps.scope.outputs.build == 'true'
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          overwrite: true
          path: release.tar
          retention-days: 14
          if-no-files-found: error

      - name: Record verification identity
        if: steps.scope.outputs.build == 'true'
        run: |
          echo "Source: $GITHUB_SHA; artifact: $ARTIFACT_URL; digest: $ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}

      - name: Preserve synthetic test evidence
        if: always() && steps.scope.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/verification/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.outputs.deploy == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: same-page-production
      cancel-in-progress: false
    environment: production
    permissions:
      contents: read
      deployments: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Admit release under production lock
        id: admission
        run: node scripts/release-admission.mjs admit

      - name: Download verified release
        if: steps.admission.outputs.proceed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}

      - name: Verify artifact before production writes
        if: steps.admission.outputs.proceed == 'true'
        run: |
          tar -xf release.tar
          node scripts/release-artifact.mjs verify "$GITHUB_SHA"

      - name: Use Node.js 24
        if: steps.admission.outputs.proceed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.admission.outputs.proceed == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Record production recovery point and aggregate state
        if: steps.admission.outputs.proceed == 'true'
        run: |
          npx wrangler d1 time-travel info same-page-production --json
          node scripts/verify-lifecycle-migration.mjs before "$RUNNER_TEMP/same-page-before-migration.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply production database migrations
        if: steps.admission.outputs.proceed == 'true'
        run: npx wrangler d1 migrations apply same-page-production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Backfill production score filenames
        if: steps.admission.outputs.proceed == 'true'
        run: node scripts/backfill-score-file-names.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production score schema
        if: steps.admission.outputs.proceed == 'true'
        run: >-
          npx wrangler d1 execute same-page-production --remote
          --command "SELECT scores.file_name, scores.file_name_key,
          scores.trashed_at, scores.trash_expires_at,
          scores.version_revision, scores.last_version_number,
          annotation_layers.default_slot
          FROM scores LEFT JOIN annotation_layers ON annotation_layers.score_id = scores.id
          LIMIT 0"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production lifecycle schema
        if: steps.admission.outputs.proceed == 'true'
        run: node scripts/verify-lifecycle-migration.mjs after "$RUNNER_TEMP/same-page-before-migration.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and assets
        if: steps.admission.outputs.proceed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/same_page/wrangler.json

      - name: Verify production deployment
        if: steps.admission.outputs.proceed == 'true'
        run: npm run verify:deployment -- https://samepage.clyapps.com "$GITHUB_SHA"

      - name: Record release result
        if: always() && steps.admission.outputs.deployment_id != ''
        run: node scripts/release-admission.mjs "$RELEASE_STATE"
        env:
          DEPLOYMENT_ID: ${{ steps.admission.outputs.deployment_id }}
          RELEASE_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
