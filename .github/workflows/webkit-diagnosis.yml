name: WebKit edit diagnosis
on:
  push:
    branches: [codex/webkit-edit-visibility]
concurrency:
  group: webkit-edit-diagnosis
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - name: Cold original assertion
        env:
          WEBKIT_EDIT_REPEATS: '1'
        run: |
          node --test --test-name-pattern='webkit: continuous editing' visual-report/reader-immersive.test.mjs > original.log 2>&1 || true
          cat original.log
          mv artifacts/verification/webkit-edit-probe artifacts/verification/original
      - name: Repeat observable completion assertion
        env:
          WEBKIT_EDIT_REPEATS: '20'
          WEBKIT_EDIT_WAIT: '1'
        run: |
          node --test --test-name-pattern='webkit: continuous editing' visual-report/reader-immersive.test.mjs
          mv artifacts/verification/webkit-edit-probe artifacts/verification/settled
      - name: Persistent second page must still fail
        env:
          WEBKIT_EDIT_REPEATS: '1'
          WEBKIT_EDIT_WAIT: '1'
          WEBKIT_EDIT_FORCE_VISIBLE: '1'
        run: |
          if node --test --test-name-pattern='webkit: continuous editing' visual-report/reader-immersive.test.mjs > negative.log 2>&1; then
            cat negative.log
            exit 1
          fi
          cat negative.log
          grep -q 'Expected: 1' negative.log
          grep -q 'Received: 2' negative.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-edit-diagnosis-${{ github.sha }}
          path: |
            artifacts/verification/
            original.log
            negative.log
          retention-days: 7
